spring.application.name=perpustakaan-bce
server.port=8080

# Database H2 (in-memory): data hilang setiap aplikasi dimatikan
spring.datasource.url=jdbc:h2:mem:perpustakaan
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# Tabel dibuat oleh schema.sql, data awal dari data.sql.
# validate = aplikasi GAGAL START jika entity tidak cocok dengan tabel.
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=always
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
